name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: fmt, vet, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build themis-bench
        run: go build -o bin/themis-bench ./benchmarks/cmd/themis-bench

      - name: build themis-serve
        run: go build -o bin/themis-serve ./cmd/themis-serve
