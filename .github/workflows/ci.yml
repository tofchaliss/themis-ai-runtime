name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmarks:
    name: Benchmark suite (fmt, vet, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: benchmarks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: benchmarks/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        run: go build -o bin/themis-bench ./cmd/themis-bench
