name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: fmt, vet, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/harness

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: src/harness/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build themis-bench
        run: go build -o bin/themis-bench ./benchmarks/cmd/themis-bench

      # themis-serve was decommissioned 2026-09-13 (integration-audit R1).
      - name: build themis-ratchet
        run: go build -o bin/themis-ratchet ./cmd/themis-ratchet
